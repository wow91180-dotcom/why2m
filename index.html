.lg-hero:before,.lg-hero:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}

.lg-hero ul{list-style:none;position:relative}.lg-hero li{padding:4px 0;opacity:.95}.lg-hero li:before{content:'✓';margin-left:8px;background:rgba(255,255,255,.2);border-radius:50%;display:inline-block;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px}
.lg-form{padding:40px 34px;display:flex;flex-direction:column;justify-content:center}
.lg-form h2{font-size:1.4rem;font-weight:800}
/* ----- shell ----- */
.side{position:fixed;top:0;right:0;bottom:0;width:256px;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 14px;z-index:60}
body.dark .side{background:#0c1430;border-left:1px solid var(--bd)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.sb-brand b{display:block;font-size:1.1rem;font-weight:800;line-height:1.2}.sb-brand small{opacity:.65}
#tabs{display:flex;flex-direction:column;gap:4px;flex:1}

#tabs a i{width:20px;text-align:center;font-size:15px}
#tabs a:hover{background:rgba(255,255,255,.08);color:#fff}

.usr{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07)}
.usr b{display:block;font-size:.9rem}.usr small{opacity:.65}
.av{width:38px;height:38px;border-radius:12px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.main{margin-right:256px;padding:22px 30px 40px;max-width:1500px}

h2{font-size:1.15rem;font-weight:800}h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.b{border:0;border-radius:11px;padding:9px 16px;color:#fff;cursor:pointer;font:inherit;font-weight:700;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);transition:.2s;box-shadow:0 4px 12px rgba(29,78,216,.22)}

label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar{display:flex;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.bar>h2{display:none}.bar>:last-child{margin-right:auto}.bar>div h2{font-size:1.3rem}
.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}

.kp{margin-bottom:18px}

.kpi:hover{transform:translateY(-3px)}
.kic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex-shrink:0}

.lg{object-fit:cover;background:#fff;border-radius:14px;width:44px;height:44px}

.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.qt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);cursor:pointer;font:inherit;font-weight:700;font-size:13px;transition:.2s}

.sc{cursor:pointer;transition:.2s}.sc:hover{transform:translateY(-4px);border-color:var(--p2)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:8px}

}

function rate(c) { const t = c.students.length * lc(c); return t ? Math.round(c.students.reduce((a, s) => a + pc(s), 0) / t * 100) : 0; }
function bar(v) { return `<div class="pb"><i style="width:${v}%"></i></div><small class="mu">${v}% نسبة الحضور</small>`; }
function norm() {
  const a = D.secretaries.admin;
  if (!a || a.role != 'admin') D.secretaries.admin = { password: (a && a.password) || '911809', name: 'الأدمن', role: 'admin' };
  Object.values(D.classes).forEach(c => {
    c.students = c.students || []; const n = lc(c); c.lessonsCount = n;
    c.lessonDates = Array.from({ length: n }, (_, i) => (c.lessonDates || [])[i] || '');
    c.students.forEach(s => {
      s.attendance = Array.from({ length: n }, (_, i) => !!(s.attendance || [])[i]); s.fee = +s.fee || 0;
      s.present = pc(s) > 0; s.paid = paidOf(s, c);
      if (!s.id) s.id = 'student_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    });
  });
}

const TABS = [['home','fa-house','الرئيسية',1],['dashboard','fa-chart-pie','لوحة التحكم',1],['stages','fa-layer-group','المراحل'],['students','fa-users','الطلاب',1],['expenses','fa-wallet','المصاريف'],['settings','fa-gear','الإعدادات',1]];

/* ---------- Data ---------- */
function fix() { D.classes = D.classes || {}; D.expenses = D.expenses || {}; D.logs = D.logs || []; D.secretaries = D.secretaries || {}; }
function ld() {
  let x = null; try { x = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  D = (x && x.classes && (x._timestamp || 0) >= (SEED._timestamp || 0)) ? x : JSON.parse(JSON.stringify(SEED));
  fix(); norm();
}
function sv(msg) {
  if (msg) { D.logs.unshift({ action: msg, time: new Date().toLocaleString('ar-EG') }); D.logs = D.logs.slice(0, 100); }
  D._timestamp = Date.now();
  localStorage.setItem(K, JSON.stringify(D));
  clearTimeout(tmr);
  tmr = setTimeout(() => window.cloud ? window.cloud.push(D) : setSync('offline'), 700);
}
function setSync(s) { $('sync').textContent = { online: '🟢 متصل', syncing: '🟡 مزامنة...', synced: '✅ متزامن', offline: '🔴 غير متصل' }[s] || ''; }
function curTs() { return D ? D._timestamp : 0; }
function curData() { return D; }
function onCloud(d) {
  if ((d._timestamp || 0) > (D._timestamp || 0)) {
    D = d; fix(); norm(); localStorage.setItem(K, JSON.stringify(D));

}

}

/* ---------- Home / Dashboard ---------- */
function stats() {
  let st = 0, pr = 0;
  Object.values(D.classes).forEach(c => c.students.forEach(s => { st++; if (pc(s) > 0) pr++; }));
  return { cl: Object.keys(D.classes).length, st, pr, ab: st - pr, ex: Object.values(D.expenses).reduce((a, e) => a + (e.amount || 0), 0) };
}
function cards() {
  const s = stats(), pct = s.st ? Math.round(s.pr / s.st * 100) : 0;
  const L = [['fa-layer-group', '#1d4ed8', 'المراحل', s.cl], ['fa-users', '#0ea5e9', 'الطلاب', s.st], ['fa-circle-check', '#16a34a', 'الحضور', s.pr], ['fa-circle-xmark', '#dc2626', 'الغياب', s.ab], ['fa-wallet', '#f59e0b', 'المصاريف', s.ex + ' ج.م'], ['fa-chart-pie', '#7c3aed', 'نسبة الحضور', pct + '%']];
  return '<div class="grid kp">' + L.map(x => `<div class="kpi"><span class="kic" style="--c:${x[1]}"><i class="fas ${x[0]}"></i></span><div><div class="kn">${x[3]}</div><small>${x[2]}</small></div></div>`).join('') + '</div>';
}
PG.home = () => {

  return `<div class="hero"><img class="lg" src="${LOGO}" alt=""><div><h2>أهلاً ${esc(U.name)} 👋</h2><p>نظرة سريعة على نشاط السنتر اليوم</p></div></div>${cards()}
  <div class="cols"><div class="card"><h3>⚡ إجراءات سريعة</h3><div class="qa" style="margin-top:12px">${Q2.map(q => `<button class="qt" style="--c:${q[2]}" onclick="${q[0]}"><i class="fas ${q[1]}"></i>${q[3]}</button>`).join('')}</div></div>
  <div class="card"><h3>📊 نسبة الحضور لكل مرحلة</h3><div class="lst" style="max-height:340px">${Object.values(D.classes).map(c => `<div style="margin:10px 0"><div class="li" style="border:0;padding:0"><b>${esc(c.name)} <small class="mu">• ${esc(c.teacher || '')}</small></b><small>${c.students.length} طالب</small></div>${bar(rate(c))}</div>`).join('') || '<p class="mu">لا توجد مراحل</p>'}</div></div></div>`;
};
PG.dashboard = () => {

  Object.values(D.classes).forEach(c => c.students.forEach(s => { const r = (s.fee || 0) - paidOf(s, c); if (r > 100) al.push(`💰 ${esc(s.name)} متبقي ${Math.round(r)} ج.م`); }));
  return cards() + `<div class="grid2"><div class="card"><h3>🕒 آخر النشاطات</h3>${D.logs.slice(0, 10).map(l => `<div class="li"><span>${esc(l.action)}</span><small class="mu">${esc(l.time)}</small></div>`).join('') || '<p class="mu">لا توجد نشاطات</p>'}</div><div class="card"><h3>🔔 التنبيهات</h3>${al.slice(0, 12).map(a => `<div class="li" style="color:var(--bad)">${a}</div>`).join('') || '<p class="mu">✅ لا توجد تنبيهات</p>'}</div></div>`;
};

/* ---------- Stages ---------- */
const newSt = (name, fee, n) => ({ id: 'student_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), name, fee, paid: 0, present: false, attendance: Array(n).fill(false) });
const stu = id => { for (const c of Object.values(D.classes)) { const s = c.students.find(x => x.id == id); if (s) return [s, c]; } return []; };
const lessonOpts = sel => [4, 8, 12, 16].map(n => `<option ${n == sel ? 'selected' : ''}>${n}</option>`).join('');

PG.stages = () => {
  if (SID && D.classes[SID]) return detail();
  SID = null;
  return `<div class="bar"><h2>📚 المراحل</h2><button class="b" onclick="stageForm()">➕ إضافة مرحلة</button></div><div class="grid2">${Object.entries(D.classes).map(([id, c]) => {
    const p = c.students.filter(s => pc(s) > 0).length;
    return `<div class="card sc" onclick="openS('${id}')"><div class="sh"><span class="av">${esc(c.name).charAt(0)}</span><div><b>${esc(c.name)}</b><div class="mu">${esc(c.teacher || 'غير محدد')}</div></div></div><p><small>${c.students.length} طالب • ${lc(c)} حصة • ${p} حاضر</small></p>${bar(rate(c))}<div class="row adm" onclick="event.stopPropagation()"><button class="b o sm" onclick="stageEdit('${id}')">✏️ تعديل</button><button class="b r sm" onclick="delStage('${id}')">🗑️ حذف</button></div></div>`;
  }).join('') || '<p class="mu">لا توجد مراحل</p>'}</div>`;
};
function openS(id) { SID = id; render(); }
function detail() {
  const c = D.classes[SID], n = lc(c), A = (s, j) => (s.attendance || [])[j];
  const dh = Array.from({ length: n }, (_, j) => { const d = (c.lessonDates || [])[j]; return `<th><span class="dt" onclick="isA()&&dateM(${j})">📅 ${d ? d.slice(8, 10) + '/' + d.slice(5, 7) : 'حصة ' + (j + 1)}</span></th>`; }).join('');
  const rows = c.students.map((s, i) => {
    const k = pc(s), pd = paidOf(s, c), r = (s.fee || 0) - pd;
    return `<tr><td>${i + 1}</td><td style="text-align:right"><b>${esc(s.name)}</b></td>${Array.from({ length: n }, (_, j) => `<td><button class="lb ${A(s, j) ? 'ok' : 'no'}" onclick="tog('${s.id}',${j})">${A(s, j) ? '✓' : '✗'}</button></td>`).join('')}<td>${k}/${n}</td><td class="adm">${s.fee || 0}</td><td class="adm">${Math.round(pd)}</td><td class="adm" style="color:var(${r > 0 ? '--bad' : '--ok'})">${r > 0 ? Math.round(r) : 0}</td><td class="adm" style="white-space:nowrap"><button class="b o sm" onclick="stEdit('${s.id}')">✏️</button> <button class="b r sm" onclick="stDel('${s.id}')">🗑️</button></td></tr>`;
  }).join('');
  return `<div class="bar"><div><h2>${esc(c.name)}</h2><span class="mu">👨‍🏫 ${esc(c.teacher || 'غير محدد')} • ${c.students.length} طالب${isA() ? ' • اضغط على تاريخ الحصة لتعديله' : ' • اضغط ✓/✗ لتسجيل الحضور'}</span></div><span class="row"><button class="b l" onclick="SID=null;render()">↩ رجوع</button><button class="b g" onclick="exportImg('tbl')">📷 صورة</button><button class="b" onclick="stAdd()">➕ طالب</button></span></div><div class="card tw" id="tbl"><table><thead><tr><th>#</th><th>الطالب</th>${dh}<th>الحضور</th><th class="adm">المبلغ</th><th class="adm">المدفوع</th><th class="adm">المتبقي</th><th class="adm"></th></tr></thead><tbody>${rows || '<tr><td colspan="20" class="mu">لا يوجد طلاب</td></tr>'}</tbody></table></div>`;
}
function tog(id, j) {
  const [s, c] = stu(id); if (!s) return;
  s.attendance = s.attendance || []; s.attendance[j] = !s.attendance[j];
  s.present = pc(s) > 0; s.paid = paidOf(s, c);
  sv('تحديث حضور ' + s.name + ' - حصة ' + (j + 1)); render();
}
function dateM(j) {
  const c = D.classes[SID];
  modal(`<h3>📅 تاريخ الحصة ${j + 1}</h3><input type="date" id="dv" value="${(c.lessonDates || [])[j] || ''}"><div class="row"><button class="b g" onclick="dateS(${j},$('dv').value)">💾 حفظ</button><button class="b r" onclick="dateS(${j},'')">مسح</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function dateS(j, v) { const c = D.classes[SID]; c.lessonDates = c.lessonDates || []; c.lessonDates[j] = v; sv('تاريخ الحصة ' + (j + 1) + ' في ' + c.name); closeM(); render(); }
function stageForm() {
  modal(`<h3>➕ مرحلة جديدة</h3><label>اسم المرحلة</label><input id="n1"><label>اسم المدرس</label><input id="t1"><label>أسماء الطلاب (افصل بفاصلة)</label><input id="s1"><label>المبلغ لكل طالب</label><input type="number" id="f1"><label>عدد الحصص</label><select id="l1">${lessonOpts(8)}</select><div class="row"><button class="b g" onclick="stageAdd()">💾 حفظ</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function stageAdd() {
  const name = $('n1').value.trim(), fee = +$('f1').value, n = +$('l1').value;
  if (!name || fee <= 0) return toast('⚠️ أدخل اسم المرحلة والمبلغ');
  const id = 'class_' + Date.now();
  D.classes[id] = { name, teacher: $('t1').value.trim() || null, lessonsCount: n, lessonDates: Array(n).fill(''), students: [], expenses: {} };
  $('s1').value.split(/[،,]/).map(x => x.trim()).filter(Boolean).forEach(x => D.classes[id].students.push(newSt(x, fee, n)));
  genMonthly(cm()); sv('أضاف مرحلة ' + name); closeM(); render();
}
function stageEdit(id) {
  const c = D.classes[id];
  modal(`<h3>✏️ تعديل المرحلة</h3><label>الاسم</label><input id="en" value="${esc(c.name)}"><label>المدرس</label><input id="et" value="${esc(c.teacher || '')}"><label>عدد الحصص</label><select id="el">${lessonOpts(lc(c))}</select><div class="row"><button class="b g" onclick="stageSave('${id}')">💾 حفظ</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function stageSave(id) {
  const c = D.classes[id], n = +$('el').value, name = $('en').value.trim();

  c.name = name; c.teacher = $('et').value.trim() || null;
  if (n != lc(c)) {
    c.students.forEach(s => { s.attendance = Array.from({ length: n }, (_, i) => !!(s.attendance || [])[i]); s.present = pc(s) > 0; s.paid = paidOf(s, { lessonsCount: n }); });
    c.lessonDates = Array.from({ length: n }, (_, i) => (c.lessonDates || [])[i] || '');
    c.lessonsCount = n;
  }
  sv('تعديل مرحلة ' + name); closeM(); render();

function delStage(id) {
  if (!confirm('هل أنت متأكد من حذف هذه المرحلة؟')) return;

}

PG.students = () => `<div class="bar"><h2>👥 كل الطلاب</h2><button class="b g" onclick="exportImg('tbl')">📷 صورة</button></div><input placeholder="🔍 ابحث عن طالب أو مرحلة..." value="${esc(Q)}" oninput="Q=this.value.toLowerCase();$('sb').innerHTML=stRows()"><div class="card tw" id="tbl" style="margin-top:10px"><table><thead><tr><th>#</th><th>الطالب</th><th>المرحلة</th><th>المدرس</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الحضور</th><th></th></tr></thead><tbody id="sb">${stRows()}</tbody></table></div>`;

/* ---------- Expenses ---------- */
let ES = '';
const stLabel = e => { const c = D.classes[e.stageId] || {}; return { g: c.name || e.stageName || '', t: c.teacher || e.stageTeacher || '' }; };
function srow([id, e]) {

function gcard([id, e]) {
  const ci = cat(e.category), r = rem(e);
  return `<div class="card"><div class="row" style="flex-wrap:nowrap;margin-top:0"><span class="ic" style="background:${ci[2]}22">${ci[1]}</span><div><b>${ci[0]}</b><div class="mu"><small>${esc(e.note || 'مصروف عام')}</small></div></div></div><div class="li"><b style="color:var(--warn);font-size:18px">${e.amount || 0} ج.م</b><span style="color:var(${r ? (e.paid > 0 ? '--warn' : '--bad') : '--ok'})">${r ? (e.paid > 0 ? '⚠️ جزئي' : '❌ غير مدفوع') : '✅ مدفوع'}</span></div><small>💳 ${e.paid || 0} • 📉 ${r}</small><div class="row">${r ? `<button class="b g sm" onclick="payFull('${id}')">✔ سدّد</button>` : ''}<button class="b o sm" onclick="expEdit('${id}')">✏️</button><button class="b r sm" onclick="expDel('${id}')">🗑️</button></div></div>`;
}
PG.expenses = () => {
  const A = isA(), isS = e => e.expenseCategory == 'student';
  const all = Object.entries(D.expenses).filter(([, e]) => e.month == EM && (A || isS(e)));
  const f = all.filter(([, e]) => (EF == 'all' || (EF == 'general' && !isS(e)) || (EF == 'student' && isS(e)) || (EF == 'unpaid' && rem(e) > 0)) && (!ES || (isS(e) && e.stageId == ES)));
  const sum = a => a.reduce((t, [, e]) => [t[0] + (e.amount || 0), t[1] + (e.paid || 0)], [0, 0]);
  const [T, PD] = sum(all), gen = f.filter(([, e]) => !isS(e)), grp = {};
  f.filter(([, e]) => isS(e)).forEach(x => { const k = x[1].stageId || '?'; (grp[k] = grp[k] || []).push(x); });
  const nm = k => (D.classes[k] || {}).name || grp[k][0][1].stageName || '';
  const fl = A ? [['all', 'الكل'], ['general', 'عامة'], ['student', 'الطلاب'], ['unpaid', 'غير مسدد']] : [['all', 'الكل'], ['unpaid', 'غير مسدد']];
  const secs = Object.keys(grp).sort((a, b) => nm(a).localeCompare(nm(b), 'ar')).map(k => {
    const rows = grp[k].slice().sort((a, b) => (a[1].studentName || '').localeCompare(b[1].studentName || '', 'ar')), [t, p] = sum(rows), c = D.classes[k] || {};
    return `<div class="card tw"><div class="li" style="padding:14px 16px;background:var(--soft);flex-wrap:wrap"><b>🏫 ${esc(c.name || nm(k))} <small class="mu">• ${esc(c.teacher || rows[0][1].stageTeacher || '')}</small></b><span><small>الإجمالي ${t}</small> • <small style="color:var(--ok)">مدفوع ${p}</small> • <small style="color:var(--bad)">متبقي ${Math.max(0, t - p)}</small></span></div><table><thead><tr><th>الطالب</th><th>النوع</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th></th></tr></thead><tbody>${rows.map(srow).join('')}</tbody></table></div>`;
  }).join('');
  return `<div class="bar"><h2>المصاريف</h2><span class="row"><button class="b l" onclick="genM()">📥 مصاريف الشهر للكل</button><button class="b o" onclick="unpaid(true)">🔔 غير المسددين</button><button class="b g" onclick="exportImg('el')">📷</button><button class="b" onclick="expForm()">➕ ${A ? 'مصروف' : 'مصروف طالب'}</button></span></div>
  <div class="card row"><input type="month" value="${EM}" style="width:auto;margin:0" onchange="EM=this.value||cm();render()"><select style="width:auto;margin:0" onchange="ES=this.value;render()"><option value="">كل المراحل</option>${Object.entries(D.classes).map(([id, c]) => `<option value="${id}" ${ES == id ? 'selected' : ''}>${esc(c.name)}${c.teacher ? ' - ' + esc(c.teacher) : ''}</option>`).join('')}</select><select style="width:auto;margin:0" onchange="EF=this.value;render()">${fl.map(o => `<option value="${o[0]}" ${EF == o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select><b>💰 ${T}</b><b style="color:var(--ok)">💳 ${PD}</b><b style="color:var(--bad)">📉 ${Math.max(0, T - PD)}</b></div>
  <div id="el">${gen.length ? `<h3 style="margin:6px 0 10px">🏢 المصاريف العامة</h3><div class="grid2" style="margin-bottom:16px">${gen.map(gcard).join('')}</div>` : ''}${secs}${!gen.length && !secs ? '<p class="mu">📭 لا توجد مصاريف</p>' : ''}</div>`;
};
function expForm() {
  EXT = isA() ? 'general' : 'student';
  const so = Object.entries(D.classes).map(([id, c]) => `<option value="${id}">${esc(c.name)}${c.teacher ? ' - ' + esc(c.teacher) : ''}</option>`).join('');
  modal(`<h3>➕ إضافة مصروف</h3>
  ${isA() ? `<div class="row"><button class="b" id="tg" onclick="exT('general')">🏢 مصاريف عامة</button><button class="b l" id="ts" onclick="exT('student')">🎓 مصاريف الطلاب</button></div>` : ''}
  <div id="xg" style="${isA() ? '' : 'display:none'}"><label>الفئة</label><select id="gc">${Object.entries(CAT).slice(0, 8).map(([k, v]) => `<option value="${k}">${v[1]} ${v[0]}</option>`).join('')}</select>
  <label>الشهر</label><input type="month" id="gm" value="${EM}"><label>المبلغ الكلي</label><input type="number" id="ga"><label>المدفوع</label><input type="number" id="gp" value="0"><label>ملاحظات</label><input id="gn"></div>
  <div id="xs" style="${isA() ? 'display:none' : ''}"><label>المرحلة</label><select id="sg" onchange="exS()"><option value="">اختر مرحلة...</option>${so}</select><div id="sl"></div>
  <label>نوع المصروف</label><select id="stp"><option value="monthly">📅 مصاريف شهر</option><option value="exam">📝 مصاريف امتحان</option><option value="other">📦 أخرى</option></select>
  <label>الشهر</label><input type="month" id="sm" value="${EM}"><label>المبلغ لكل طالب</label><input type="number" id="sa"><label>المدفوع لكل طالب</label><input type="number" id="sp" value="0"><label>ملاحظات</label><input id="sn"></div>
  <div class="row"><button class="b g" onclick="exSave()">💾 حفظ</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function exT(t) {
  EXT = t; $('xg').style.display = t == 'general' ? 'block' : 'none'; $('xs').style.display = t == 'student' ? 'block' : 'none';
  $('tg').className = 'b' + (t == 'general' ? '' : ' l'); $('ts').className = 'b' + (t == 'student' ? '' : ' l');
}
function exS() {
  const c = D.classes[$('sg').value];
  $('sl').innerHTML = c ? `<label class="chk"><input type="checkbox" onchange="document.querySelectorAll('.sc').forEach(x=>x.checked=this.checked)"> <b>تحديد الكل</b></label><div class="lst">${c.students.map(s => `<label class="chk"><input type="checkbox" class="sc" value="${s.id}"> ${esc(s.name)}</label>`).join('')}</div>` : '';
}
function exSave() {
  const now = new Date().toISOString();
  if (EXT == 'general') {
    const m = $('gm').value, a = +$('ga').value, k = $('gc').value;
    if (!m || a <= 0) return toast('⚠️ اختر الشهر وأدخل المبلغ');
    D.expenses['exp_' + Date.now()] = { category: k, month: m, amount: a, paid: +$('gp').value || 0, note: $('gn').value.trim(), expenseCategory: 'general', createdAt: now };
    EM = m; sv('مصروف ' + cat(k)[0] + ' بقيمة ' + a + ' ج.م');
  } else {
    const gid = $('sg').value, c = D.classes[gid], ids = [...document.querySelectorAll('.sc:checked')].map(x => x.value), a = +$('sa').value, t = $('stp').value, m = $('sm').value;
    if (!c) return toast('⚠️ اختر المرحلة');
    if (!ids.length) return toast('⚠️ اختر طالبًا واحدًا على الأقل');
    if (!m || a <= 0) return toast('⚠️ اختر الشهر وأدخل المبلغ');
    c.students.filter(s => ids.includes(s.id)).forEach((s, i) => {
      D.expenses['exp_student_' + Date.now() + '_' + i] = { category: 'student_expense', studentExpenseType: t, stageId: gid, stageName: c.name, stageTeacher: c.teacher || '', studentId: s.id, studentName: s.name, amount: a, paid: +$('sp').value || 0, note: $('sn').value.trim(), expenseCategory: 'student', month: m, createdAt: now };
    });
    EM = m; sv('مصروف طلاب (' + cat(t)[0] + ') ' + a + ' × ' + ids.length);
  }
  closeM(); render();
}
function payFull(id) { const e = D.expenses[id]; if (!e) return; e.paid = e.amount; sv('تسديد مصروف كامل'); render(); toast('✅ تم التسديد'); }
function expDel(id) { if (!confirm('حذف هذا المصروف؟')) return; delete D.expenses[id]; sv('حذف مصروف'); render(); }
function expEdit(id) {
  const e = D.expenses[id]; if (!e) return;
  modal(`<h3>✏️ تعديل المصروف</h3><label>المبلغ</label><input type="number" id="xa" value="${e.amount || 0}"><label>المدفوع</label><input type="number" id="xp" value="${e.paid || 0}"><label>ملاحظات</label><input id="xn" value="${esc(e.note || '')}"><div class="row"><button class="b g" onclick="expSave('${id}')">💾 حفظ</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function expSave(id) {
  const e = D.expenses[id], a = +$('xa').value; if (!e) return;
  if (a <= 0) return toast('⚠️ أدخل المبلغ');
  e.amount = a; e.paid = +$('xp').value || 0; e.note = $('xn').value.trim(); sv('تعديل مصروف'); closeM(); render();
}


let GD = false;
function genMonthly(m) {
  let n = 0; const now = new Date().toISOString();
  const has = new Set(Object.values(D.expenses).filter(e => e.expenseCategory == 'student' && e.studentExpenseType == 'monthly' && e.month == m).map(e => e.studentId));
  Object.entries(D.classes).forEach(([cid, c]) => c.students.forEach(s => {
    if (has.has(s.id) || !(s.fee > 0)) return;
    D.expenses['exp_m_' + m + '_' + s.id] = { category: 'student_expense', studentExpenseType: 'monthly', stageId: cid, stageName: c.name, stageTeacher: c.teacher || '', studentId: s.id, studentName: s.name, amount: s.fee, paid: 0, note: '', expenseCategory: 'student', month: m, createdAt: now };
    n++;
  }));
  return n;
}
function genM() {
  const n = genMonthly(EM);
  if (n) { sv('إضافة مصاريف شهر ' + EM + ' لـ ' + n + ' طالب'); render(); toast('✅ تمت إضافة مصاريف ' + n + ' طالب'); }
  else toast('ℹ️ كل الطلاب عليهم مصاريف هذا الشهر بالفعل');
}
function afterCloud() {   // يعمل بعد انتهاء مزامنة السحابة حتى لا يكتب فوق بيانات أحدث
  if (GD || !U) return; GD = true;
  const n = genMonthly(cm());
  if (n) { sv('إضافة مصاريف شهر ' + cm() + ' لـ ' + n + ' طالب'); render(); toast('📥 تمت إضافة مصاريف الشهر لـ ' + n + ' طالب'); }
}

/* ---------- Unpaid students alert (end of month) ---------- */
function unpaidList(m) {
  const o = {};
  Object.values(D.expenses).forEach(e => {
    if (e.expenseCategory != 'student' || e.month != m || !rem(e)) return;
    const x = o[e.studentId] || (o[e.studentId] = { name: e.studentName, stage: stLabel(e).t + ' • ' + stLabel(e).g, total: 0, it: [] });
    x.total += rem(e); x.it.push(cat(e.studentExpenseType)[0]);
  });
  return Object.values(o).sort((a, b) => b.total - a.total);
}
function unpaid(force) {
  const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
  if (!force) {
    const k = 'unpaid_' + n.toISOString().slice(0, 10);
    if (n.getDate() < last - 2 || localStorage.getItem(k)) return; // آخر 3 أيام، مرة في اليوم
    localStorage.setItem(k, 1);
  }
  const l = unpaidList(force ? EM : cm());
  if (!l.length) { if (force) toast('✅ كل الطلاب سددوا مصاريف الشهر'); return; }
  modal(`<h3 style="color:var(--bad)">🔔 طلاب لم يسددوا مصاريف الشهر (${l.length})</h3><div class="lst">${l.map((u, i) => `<div class="li"><div><b>${i + 1}. ${esc(u.name)}</b><br><small class="mu">${esc(u.stage || '')} • ${u.it.join('، ')}</small></div><b style="color:var(--bad)">${u.total} ج.م</b></div>`).join('')}</div><div class="row"><button class="b" onclick="closeM();EF='unpaid';go('expenses')">💰 فتح المصاريف</button><button class="b l" onclick="closeM()">إغلاق</button></div>`);
}

/* ---------- Settings ---------- */
PG.settings = () => `<div class="grid2"><div class="card"><h3>🗄️ البيانات</h3><div class="row"><button class="b" onclick="expJ()">⬇️ تصدير</button><button class="b l" onclick="impJ()">⬆️ استيراد</button><button class="b" onclick="syncNow()">☁️ مزامنة الآن</button><button class="b r" onclick="clr()">🗑️ حذف كل البيانات</button></div></div><div class="card"><h3>👩‍💼 السكرتيرات</h3>${Object.entries(D.secretaries).map(([u, s], i) => `<div class="li"><span>${esc(s.name || u)} <small class="mu">${esc(u)} • ${s.role == 'admin' ? '👑 أدمن' : 'سكرتيرة'}</small></span>${s.role == 'admin' ? '' : `<button class="b r sm" onclick="delSec(${i})">🗑️</button>`}</div>`).join('') || '<p class="mu">لا توجد سكرتيرات</p>'}</div></div>`;
function expJ() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }));
  a.download = 'why2m_backup_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); toast('✅ تم تصدير النسخة الاحتياطية');
}
function impJ() {
  if (U.role != 'admin') return toast('⚠️ الاستيراد للأدمن فقط');
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => readJ(ev.target.result); r.readAsText(f); };
  i.click();
}
function readJ(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return toast('❌ الملف ليس JSON صالحًا'); }
  if (!d || typeof d.classes != 'object') return toast('❌ الملف لا يحتوي على بيانات المراحل');
  const n = o => Object.keys(o || {}).length, ns = Object.values(d.classes).reduce((a, c) => a + ((c && c.students) || []).length, 0);
  window.IMP = d;
  modal(`<h3>⬆️ استيراد ملف JSON</h3><div class="grid" style="margin:12px 0"><div class="card st"><div class="n">${n(d.classes)}</div><small>مرحلة</small></div><div class="card st"><div class="n">${ns}</div><small>طالب</small></div><div class="card st"><div class="n">${n(d.expenses)}</div><small>مصروف</small></div></div><p class="mu">اختر طريقة الاستيراد:</p><div class="row"><button class="b g" onclick="doImp('merge')">➕ دمج مع الحالي</button><button class="b o" onclick="doImp('replace')">♻️ استبدال الكل</button><button class="b l" onclick="closeM()">إلغاء</button></div>`);
}
function doImp(mode) {
  const d = window.IMP; if (!d) return;
  if (mode == 'replace') { if (!confirm('سيتم استبدال كل البيانات الحالية. متأكد؟')) return; D = d; fix(); }
  else {
    Object.entries(d.classes).forEach(([id, c]) => {
      const t = D.classes[id]; if (!t) { D.classes[id] = c; return; }
      const ids = new Set(t.students.map(s => s.id)); (c.students || []).forEach(s => { if (!ids.has(s.id)) t.students.push(s); });
    });
    Object.assign(D.expenses, d.expenses || {});
    Object.entries(d.secretaries || {}).forEach(([u, s]) => { if (!D.secretaries[u]) D.secretaries[u] = s; });
  }
  norm(); sv('استيراد بيانات (' + (mode == 'merge' ? 'دمج' : 'استبدال') + ')'); closeM(); render(); toast('✅ تم الاستيراد بنجاح');
}
function syncNow() { if (!window.cloud) return toast('⚠️ Firebase غير متاح'); toast('⏳ جاري المزامنة...'); window.cloud.push(D).then(ok => toast(ok ? '✅ تمت المزامنة' : '⚠️ فشلت المزامنة')); }
function clr() { if (!confirm('⚠️ حذف كل المراحل والطلاب والمصاريف؟') || !confirm('تأكيد نهائي؟')) return; D = { classes: {}, expenses: {}, logs: [], secretaries: D.secretaries }; sv(); render(); toast('✅ تم الحذف'); }
function delSec(i) { const u = Object.keys(D.secretaries)[i]; if (!u || u == 'admin' || !confirm('حذف "' + u + '"؟')) return; delete D.secretaries[u]; sv('حذف سكرتيرة ' + u); render(); }

/* ---------- Init ---------- */
ld();
document.querySelectorAll('img.lg').forEach(i => i.src = LOGO);
{ const l = document.createElement('link'); l.rel = 'icon'; l.href = LOGO; document.head.appendChild(l); }
if (localStorage.theme == 'dark') document.body.classList.add('dark');
$('modal').onclick = e => { if (e.target.id == 'modal') closeM(); };
$('lp').onkeydown = $('lu').onkeydown = e => { if (e.key == 'Enter') login(); };
try { const u = JSON.parse(localStorage.getItem('cu')); if (u) start(u); } catch (e) {}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
